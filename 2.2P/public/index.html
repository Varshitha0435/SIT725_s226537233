
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIT725 - Addition Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            padding: 40px;
        }

        .calculator {
            background: white;
            max-width: 420px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ddd;
        }

        input, button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            box-sizing: border-box;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>My Addition Calculator</h2>
        <p>SIT725 - Task 2.2P</p>

        <label for="firstNumber">First number</label>
        <input type="number" id="firstNumber" step="any">

        <label for="secondNumber">Second number</label>
        <input type="number" id="secondNumber" step="any">

        <button onclick="addNumbers()">Add Numbers</button>

        <p id="result">Enter two numbers to calculate.</p>
    </div>

    <script>
        async function addNumbers() {
            const a = document.getElementById('firstNumber').value;
            const b = document.getElementById('secondNumber').value;
            const result = document.getElementById('result');

            if (a.trim() === '' || b.trim() === '') {
                result.textContent = 'Please enter both numbers.';
                return;
            }

            try {
                const response = await fetch(
                    `/add?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`
                );

                const data = await response.json();

                if (!response.ok) {
                    result.textContent = data.error;
                    return;
                }

                result.textContent = `Result: ${data.result}`;
            } catch (error) {
                result.textContent = 'Could not connect to the server.';
            }
        }
    </script>
</body>
</html>
